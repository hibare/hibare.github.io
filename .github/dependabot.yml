# Managed by Axon; manual edits will be overwritten.
version: 2
updates:

  # Maintain dependencies for pre-commit
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "00:30"
      timezone: "UTC"
    target-branch: "master"
    cooldown:
      default-days: 5
    assignees:
      - "hibare"
    groups:
      pre-commit:
        patterns:
          - "*"
